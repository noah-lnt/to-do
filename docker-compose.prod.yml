# =============================================
# Production — Single Server (App + DB + Backup)
# =============================================
# Traefik is externalized and shared between multiple apps
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Prerequisites:
#   - External Traefik instance running on the same server
#   - External "web" network created: docker network create web
#
# Architecture:
#   [External Traefik] ──► [app] ──► [db]
#                                  └──► [backup] ──► NAS (rsync)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-todoapp}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${APP_DOMAIN}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.todo-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.todo-http.entrypoints=web"
      - "traefik.http.routers.todo-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTPS
      - "traefik.http.routers.todo-https.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.todo-https.entrypoints=websecure"
      - "traefik.http.routers.todo-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.todo-app.loadbalancer.server.port=3000"
    networks:
      - web
      - internal

  db:
    image: postgres:16-alpine
    container_name: todo-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: todo-backup
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # S3 (MinIO on Synology or AWS)
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PREFIX=${S3_PREFIX:-postgres-backups}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-3}
      # Synology rsync/SSH
      - RSYNC_ENABLED=${RSYNC_ENABLED:-false}
      - RSYNC_TARGET=${RSYNC_TARGET:-}
    volumes:
      - backup_data:/backups
      # Mount SSH key for rsync to Synology NAS
      - ${SSH_KEY_PATH:-/dev/null}:/root/.ssh/id_ed25519:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  backup_data:

networks:
  # External network managed by Traefik
  web:
    external: true
  # Internal network for app ↔ db communication
  internal:
    driver: bridge
