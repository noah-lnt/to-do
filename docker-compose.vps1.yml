# =============================================
# VPS 1 — Primary (Traefik + App + DB + Backup)
# =============================================
# Usage: docker compose -f docker-compose.vps1.yml up -d --build

services:
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@example.com}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"  # Dashboard accessible localement uniquement
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - web

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db-primary:5432/${POSTGRES_DB:-todoapp}?schema=public
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=https://${APP_DOMAIN}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CRON_SECRET=${CRON_SECRET:-}
    depends_on:
      db-primary:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.todo-http.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.todo-http.entrypoints=web"
      - "traefik.http.routers.todo-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      # HTTPS
      - "traefik.http.routers.todo-https.rule=Host(`${APP_DOMAIN}`)"
      - "traefik.http.routers.todo-https.entrypoints=websecure"
      - "traefik.http.routers.todo-https.tls.certresolver=letsencrypt"
      - "traefik.http.services.todo-app.loadbalancer.server.port=3000"
    networks:
      - web
      - internal

  db-primary:
    image: postgres:16-alpine
    container_name: todo-db-primary
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
      - REPLICATION_USER=${REPLICATION_USER:-replicator}
      - REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - postgres_wal_archive:/var/lib/postgresql/wal_archive
      - ./docker/postgres-primary/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Port 5432 exposé uniquement au VPS2 via le firewall
    ports:
      - "${REPLICATION_BIND:-0.0.0.0}:5432:5432"
    networks:
      - internal

  backup:
    build:
      context: ./docker/backup
      dockerfile: Dockerfile
    container_name: todo-backup
    restart: unless-stopped
    environment:
      - DB_HOST=db-primary
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-todoapp}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      # S3 (MinIO sur Synology ou AWS)
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_PREFIX=${S3_PREFIX:-postgres-backups}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-eu-west-3}
      # Synology rsync/SSH
      - RSYNC_ENABLED=${RSYNC_ENABLED:-false}
      - RSYNC_TARGET=${RSYNC_TARGET:-}
    volumes:
      - backup_data:/backups
      # Monter la clé SSH pour rsync vers Synology
      - ${SSH_KEY_PATH:-/dev/null}:/root/.ssh/id_ed25519:ro
    depends_on:
      db-primary:
        condition: service_healthy
    networks:
      - internal

volumes:
  traefik_certs:
  postgres_primary_data:
  postgres_wal_archive:
  backup_data:

networks:
  web:
    driver: bridge
  internal:
    driver: bridge
