name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # ===========================================
  # CI: Lint & Type Check
  # ===========================================
  ci:
    name: CI - Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  # ===========================================
  # Deploy: SSH to Server
  # ===========================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "📥 Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Rebuilding and restarting app..."
            docker compose -f docker-compose.prod.yml up -d --build app

            echo "⏳ Waiting for app to start..."
            sleep 10

            echo "🔍 Running database migrations..."
            docker exec todo-app npx prisma db push --skip-generate

            echo "✅ Deployment complete!"

      - name: Health Check
        run: |
          echo "Waiting for app to be ready..."
          sleep 5

          # Retry health check up to 5 times
          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.APP_DOMAIN }}/api/health" || echo "000")
            if [ "$response" = "200" ]; then
              echo "✅ Health check passed!"
              exit 0
            fi
            echo "Attempt $i: Got HTTP $response, retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed after 5 attempts"
          exit 1

  # ===========================================
  # Notify: Slack/Discord (optional)
  # ===========================================
  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success() && vars.SLACK_WEBHOOK_URL != ''

    steps:
      - name: Send Slack notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ TaskFlow deployed successfully!\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure() && vars.SLACK_WEBHOOK_URL != ''

    steps:
      - name: Send Slack notification
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"❌ TaskFlow deployment FAILED!\nCommit: ${{ github.sha }}\nBy: ${{ github.actor }}\nSee: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            ${{ vars.SLACK_WEBHOOK_URL }}
